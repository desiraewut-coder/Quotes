<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Starthread Quotes</title><style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#ffffff}body{display:flex;align-items:center;justify-content:center;padding:22px 40px;font-family:Georgia,'Times New Roman',serif;color:#302c28}.quote{position:relative;width:min(100%,880px);text-align:center;padding:25px 55px 18px}.quote-text{font-size:clamp(21px,3.2vw,35px);font-style:italic;font-weight:400;line-height:1.5;letter-spacing:.005em;overflow-wrap:break-word}.quote-text::before,.quote-text::after{font-size:1.8em;color:#b89c69;font-style:normal;line-height:0;vertical-align:-.23em}.quote-text::before{content:'“';margin-right:.09em}.quote-text::after{content:'”';margin-left:.09em}.author{font-size:clamp(13px,1.65vw,17px);letter-spacing:.09em;margin-top:23px;color:#7a664c;font-style:normal}@media(max-width:550px){body{padding:16px 12px}.quote{padding:20px 10px}.quote-text{font-size:23px}}
</style></head><body><main class="quote" aria-live="polite"><div class="quote-text" id="quote"></div><div class="author" id="author"></div></main><script>
// Edit this list to add your own confirmed book quotes.
const quotes=[
  {
    "text": "If you will not hear me, I will make myself heard.",
    "author": "Cade"
  },
  {
    "text": "Whose child is that?",
    "author": "Varos"
  },
  {
    "text": "I can count.",
    "author": "Cade"
  },
  {
    "text": "You’ve missed a few.",
    "author": "Mae"
  },
  {
    "text": "She is mine.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "I reject you.",
    "author": "Cade"
  },
  {
    "text": "But don’t touch the boy.",
    "author": "Veda"
  },
  {
    "text": "I’m Elaria. But if you ever call me that, I’ll make sure you regret it.",
    "author": "Elle"
  },
  {
    "text": "The Waystone it is!",
    "author": "Yaris"
  },
  {
    "text": "As it was.",
    "author": "Veyrathi"
  },
  {
    "text": "You look nice.",
    "author": "Speaker TBD"
  },
  {
    "text": "I pulled on one that was already fraying.",
    "author": "Caelith"
  },
  {
    "text": "I remember fourteen voices where there are none now.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "I have known the beginning of every world.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "And I have known its end.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "But perhaps the measure had been wrong.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "For creation is not always the act of making something new.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "Sometimes it is the recognition of what has been waiting to exist.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "I would not repeat the same beginning.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "Simply as another beginning.",
    "author": "The Cosmic Mother"
  },
  {
    "text": "She had made the universe, and yet there was no one to witness it.",
    "author": "The First Creations"
  },
  {
    "text": "So she began again.",
    "author": "The First Creations"
  },
  {
    "text": "They did not yet understand how much they had lost.",
    "author": "The First Creations"
  },
  {
    "text": "They believed they had sacrificed enough.",
    "author": "The First Creations"
  },
  {
    "text": "But the universe had never promised that love would come without consequence.",
    "author": "The First Creations"
  },
  {
    "text": "And somewhere, among the worlds they had made, a heart was already beginning to break.",
    "author": "The First Creations"
  },
  {
    "text": "He had stopped believing that anyone would.",
    "author": "The Thing Beneath"
  }
];
// Rotate every 20 minutes using the viewer's local clock. A new quote
// appears at :00, :20 and :40, even if the page remains open.
const quoteNode=document.getElementById('quote');
const authorNode=document.getElementById('author');
let displayedSlot=null;
function updateQuote(){
  const now=new Date();
  const slotNumber=Math.floor(now.getTime()/1200000);
  if(slotNumber===displayedSlot)return;
  displayedSlot=slotNumber;
  const index=((slotNumber%quotes.length)+quotes.length)%quotes.length;
  quoteNode.textContent=quotes[index].text;
  authorNode.textContent='— '+quotes[index].author;
}
updateQuote();
// Check frequently so the quote changes even when the Notion page stays open.
setInterval(updateQuote,10000);
</script></body></html>
